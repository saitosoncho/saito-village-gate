<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>齋藤村一周年 SETLIST LIVE Voyage｜OBS Display Ver.1.2</title>
  <style>
    :root {
      --navy: #14264b;
      --navy-soft: #334668;
      --gold: #b78a3c;
      --gold-light: #f3d99c;
      --ivory: rgba(255, 252, 246, .84);
      --ivory-soft: rgba(255, 252, 246, .48);
      --line: rgba(183, 138, 60, .35);
      --shadow: 0 1.4vh 4vh rgba(40, 54, 90, .14);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
      color: var(--navy);
      background: #d9eaff;
      user-select: none;
    }

    .stage {
      position: relative;
      width: auto;
      height: 100vh;
      aspect-ratio: 708 / 1536;
      overflow: hidden;
      isolation: isolate;
      background-image:
        linear-gradient(90deg, rgba(255,255,255,.12), transparent 28%),
        url("https://raw.githubusercontent.com/saitosoncho/saito-village-gate/main/voyage-obs-bg.png");
      background-size: cover;
      background-position: center center;
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(circle at 18% 52%, rgba(255,255,255,.28), transparent 36%),
        linear-gradient(90deg, rgba(255,255,255,.08), transparent 48%);
    }

    .lighting {
      position: absolute;
      inset: 0;
      z-index: 2;
      overflow: hidden;
      pointer-events: none;
      opacity: .92;
      mix-blend-mode: screen;
      background:
        radial-gradient(circle at 76% 24%, var(--light-a,rgba(255,211,128,.28)), transparent 31%),
        radial-gradient(circle at 28% 52%, var(--light-b,rgba(120,190,255,.18)), transparent 38%),
        linear-gradient(180deg, var(--light-top,rgba(90,164,255,.1)), transparent 48%);
      transition: opacity 1s ease, background 1.4s ease;
    }
    .lighting i {
      position: absolute;
      top: -18%;
      width: 13%;
      height: 82%;
      border-radius: 50%;
      transform-origin: 50% 0;
      background: linear-gradient(180deg, var(--beam,rgba(255,240,190,.38)), transparent 82%);
      filter: blur(8px);
      opacity: .58;
      animation: lightSweep 7s ease-in-out infinite alternate;
    }
    .lighting i:nth-child(1) { left: 17%; transform: rotate(-18deg); }
    .lighting i:nth-child(2) { left: 53%; animation-delay: -2.8s; transform: rotate(11deg); }
    .lighting i:nth-child(3) { left: 81%; animation-delay: -4.6s; transform: rotate(24deg); }
    .lights-off .lighting { opacity: 0; }
    @keyframes lightSweep {
      from { translate: -3vw 0; rotate: -5deg; opacity: .28; }
      to { translate: 4vw 0; rotate: 7deg; opacity: .68; }
    }

    .setlist {
      position: absolute;
      z-index: 4;
      left: 3.4%;
      top: 16.2%;
      width: 50%;
      padding: .72vh .75vw .68vh;
      border: 1px solid rgba(255,255,255,.56);
      border-left-color: rgba(183,138,60,.52);
      border-radius: 1vh;
      background: linear-gradient(135deg, rgba(255,255,255,.77), rgba(255,251,242,.48));
      box-shadow: var(--shadow), inset 0 0 0 1px rgba(255,255,255,.28);
      backdrop-filter: blur(8px) saturate(1.06);
      -webkit-backdrop-filter: blur(8px) saturate(1.06);
    }

    .setlist-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 .2vw .26vh;
      padding-bottom: .3vh;
      border-bottom: 1px solid var(--line);
      letter-spacing: .22em;
      font-size: clamp(9px, .9vw, 18px);
      color: rgba(20,38,75,.68);
    }

    .now-label {
      display: inline-flex;
      align-items: center;
      gap: .35vw;
      min-height: 1.15vh;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: clamp(7px, .63vw, 13px);
      letter-spacing: .14em;
      color: var(--gold);
      opacity: 0;
      transition: opacity .45s ease;
    }
    .now-label.on { opacity: 1; }

    .equalizer { display: inline-flex; align-items: end; gap: 2px; height: 1.05em; }
    .equalizer i {
      display: block; width: 2px; height: 35%; border-radius: 3px; background: var(--gold);
      animation: eq .9s ease-in-out infinite alternate;
    }
    .equalizer i:nth-child(2) { animation-delay: -.35s; }
    .equalizer i:nth-child(3) { animation-delay: -.62s; }
    @keyframes eq { to { height: 100%; } }

    .tracks { display: flex; flex-direction: column; gap: 0; }
    .track {
      --delay: 0ms;
      position: relative;
      display: grid;
      grid-template-columns: 2.25em minmax(0, 1fr);
      align-items: center;
      min-height: 1.43vh;
      padding: .06vh .42vw;
      border-bottom: 1px solid rgba(183,138,60,.18);
      border-radius: .38vh;
      overflow: hidden;
      opacity: .9;
      transform: translateZ(0);
      transition: opacity .55s ease, filter .55s ease, transform .55s ease,
                  background .55s ease, box-shadow .55s ease, max-height .7s ease,
                  margin .7s ease, padding .7s ease, border-width .7s ease;
      animation: trackIn .65s both;
      animation-delay: var(--delay);
    }
    @keyframes trackIn {
      from { opacity: 0; transform: translateX(-1.8vw); }
      to { opacity: .9; transform: translateX(0); }
    }

    .track-no {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(8px, .9vw, 16px);
      letter-spacing: .04em;
      color: var(--gold);
      font-variant-numeric: tabular-nums;
    }
    .track-copy {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(0, .8fr);
      align-items: center;
      gap: .45vw;
      line-height: 1;
    }
    .track-title {
      display: block;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-weight: 700;
      font-size: clamp(8px, 1vw, 17px);
      letter-spacing: .015em;
      text-shadow: 0 1px 0 rgba(255,255,255,.68);
    }
    .track-artist {
      display: block;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      margin-top: 0;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: clamp(6px, .58vw, 11px);
      letter-spacing: .02em;
      text-align: right;
      color: rgba(51,70,104,.72);
    }

    .track.done {
      opacity: .2;
      filter: grayscale(.85) saturate(.35);
      transform: scale(.985);
    }
    .track.done .track-title { text-decoration: line-through; text-decoration-thickness: 1px; }

    .track.current {
      z-index: 2;
      opacity: 1;
      filter: none;
      transform: translateX(.35vw) scale(1.015);
      background: linear-gradient(90deg, rgba(255,248,224,.94), rgba(255,255,255,.72));
      box-shadow: 0 .55vh 1.5vh rgba(112,77,23,.18), inset .28vw 0 0 var(--gold);
      animation: currentGlow 2.4s ease-in-out infinite;
    }
    .track.current .track-no { color: #8b5e16; }
    .track.current .track-title { color: #0e2148; }
    @keyframes currentGlow {
      50% { box-shadow: 0 .8vh 2vh rgba(112,77,23,.24), inset .28vw 0 0 #d8ad58; }
    }

    .track.encore {
      max-height: 0;
      min-height: 0;
      padding-top: 0;
      padding-bottom: 0;
      margin: 0;
      border-width: 0;
      opacity: 0;
      pointer-events: none;
    }
    .encore-open .track.encore {
      max-height: 1.7vh;
      min-height: 1.43vh;
      padding-top: .06vh;
      padding-bottom: .06vh;
      border-width: 0 0 1px;
      opacity: .9;
      pointer-events: auto;
      animation: encoreReveal 1.2s cubic-bezier(.2,.75,.15,1) both;
    }
    .encore-open .track.encore:nth-last-child(1) { animation-delay: .18s; }
    @keyframes encoreReveal {
      0% { opacity: 0; transform: translateY(-1.2vh) scale(.92); filter: brightness(1.8); }
      60% { opacity: 1; filter: brightness(1.3); }
      100% { opacity: .9; transform: translateY(0) scale(1); filter: none; }
    }
    .track.encore::after {
      display: none;
    }

    .particles { position: absolute; inset: 0; z-index: 5; pointer-events: none; overflow: hidden; }
    .particle { position: absolute; top: -12%; will-change: transform, opacity; }
    .note {
      color: rgba(255,250,220,.95);
      text-shadow: 0 0 7px rgba(255,255,255,.95), 0 0 16px rgba(255,196,75,.95), 0 0 34px rgba(255,160,45,.72);
      font-family: Georgia, serif;
      animation: noteFall var(--dur) linear var(--wait) infinite;
    }
    @keyframes noteFall {
      0% { transform: translate3d(0,-8vh,0) rotate(0deg); opacity: 0; }
      12% { opacity: var(--alpha); }
      82% { opacity: var(--alpha); }
      100% { transform: translate3d(var(--drift),120vh,0) rotate(var(--spin)); opacity: 0; }
    }
    .feather {
      width: var(--size); height: calc(var(--size) * 2.8);
      border-radius: 85% 15% 85% 15% / 60% 20% 80% 40%;
      background: linear-gradient(150deg, rgba(255,255,255,.98), rgba(255,213,231,.62));
      box-shadow: inset 1px 0 rgba(255,255,255,.95), 0 0 9px rgba(255,255,255,.82), 0 0 20px rgba(255,198,221,.62);
      transform-origin: center;
      animation: featherFall var(--dur) ease-in-out var(--wait) infinite;
    }
    .feather::after {
      content: ""; position: absolute; left: 52%; top: 8%; bottom: -16%; width: 1px;
      background: rgba(171,130,153,.48); transform: rotate(4deg);
    }
    @keyframes featherFall {
      0% { transform: translate3d(0,-10vh,0) rotate(-25deg); opacity: 0; }
      13% { opacity: var(--alpha); }
      45% { transform: translate3d(calc(var(--drift) * .45),48vh,0) rotate(28deg); }
      78% { opacity: var(--alpha); }
      100% { transform: translate3d(var(--drift),120vh,0) rotate(-18deg); opacity: 0; }
    }
    .fx-off .particle { display: none; }
    .fx-soft .particle:nth-child(2n) { display: none; }

    .control-hotspot {
      position: absolute; z-index: 20; top: 1.2vh; right: 1.2vw;
      width: 6vh; height: 6vh; border: 0; border-radius: 50%; cursor: pointer;
      display: grid; place-items: center;
      font-size: 2.4vh; color: white; background: rgba(20,38,75,.65);
      box-shadow: 0 .4vh 1.4vh rgba(20,38,75,.2);
      opacity: 0; transition: opacity .25s ease, transform .25s ease;
    }
    .control-hotspot:hover, .control-hotspot:focus-visible { opacity: .9; transform: rotate(30deg); }

    .settings {
      position: absolute; z-index: 30; inset: 0 0 0 auto;
      width: min(78vw, 540px); padding: 2.3vh 4.2vw 3vh;
      display: flex; flex-direction: column;
      background: rgba(250,249,247,.96);
      color: #172747;
      box-shadow: -2vw 0 6vw rgba(16,33,68,.26);
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      transform: translateX(105%); transition: transform .4s cubic-bezier(.2,.8,.2,1);
      overflow-y: auto;
    }
    .settings.open { transform: translateX(0); }
    .settings h2 { margin: 0 0 .4vh; font: 700 2.6vh/1.2 Georgia, serif; }
    .settings-note { margin: 0 0 1.6vh; font-size: 1.25vh; color: #65708a; }
    .settings-close {
      position: absolute; right: 3vw; top: 1.6vh; border: 0; background: transparent;
      color: #243554; font-size: 3vh; cursor: pointer;
    }
    .control-row { display: grid; grid-template-columns: 1fr 1.35fr; gap: 1.2vw; margin-bottom: 1.1vh; }
    .control-row.three { grid-template-columns: 1fr 1fr 1fr; }
    .ctrl {
      min-height: 4.4vh; border: 1px solid rgba(31,50,84,.18); border-radius: 1vh;
      background: white; color: #1d3156; padding: .7vh 1vw; cursor: pointer;
      font: 650 1.35vh/1.15 ui-sans-serif, system-ui, sans-serif;
      box-shadow: 0 .35vh 1vh rgba(31,50,84,.06);
    }
    .ctrl:hover { border-color: #b78a3c; }
    .ctrl.primary { color: #fff; background: linear-gradient(135deg,#8b641d,#c89e51); }
    .ctrl.danger { color: #9b3349; }
    .setting-block { margin: 1.1vh 0; padding-top: 1.1vh; border-top: 1px solid rgba(31,50,84,.12); }
    .setting-title { margin-bottom: .8vh; font-size: 1.25vh; font-weight: 800; letter-spacing: .08em; }
    .fx-options { display: grid; grid-template-columns: repeat(3,1fr); gap: .8vw; }
    .song-buttons { display: grid; grid-template-columns: 1fr; gap: .55vh; }
    .song-button {
      width: 100%; min-height: 3.7vh; display: grid; grid-template-columns: 2.6em 1fr;
      text-align: left; align-items: center; border: 1px solid rgba(31,50,84,.12);
      border-radius: .75vh; background: rgba(255,255,255,.82); color: #263857;
      padding: .5vh 1vw; cursor: pointer; font-size: 1.15vh;
    }
    .song-button.active { border-color: #b78a3c; background: #fff7df; color: #714d0d; font-weight: 800; }
    .song-button.locked { display: none; }
    .shortcut { margin-top: 1.3vh; color: #7b8292; font-size: 1.05vh; line-height: 1.55; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <main id="stage" class="stage fx-normal" aria-label="Voyage OBS display">
    <div class="lighting" aria-hidden="true"><i></i><i></i><i></i></div>
    <div id="particles" class="particles" aria-hidden="true"></div>

    <section id="setlist" class="setlist" aria-label="セットリスト">
      <header class="setlist-head">
        <span>SET LIST</span>
        <span id="nowLabel" class="now-label"><span class="equalizer"><i></i><i></i><i></i></span> NOW SINGING</span>
      </header>
      <div id="tracks" class="tracks"></div>
    </section>

  </main>

  <script>
    (() => {
      "use strict";

      const songs = [
        ["Voyage", "浜崎あゆみ"],
        ["真冬のパンセ", "KinKi Kids"],
        ["TRUE BLUE.", "LUNA SEA"],
        ["flower", "L'Arc-en-Ciel"],
        ["春咲センチメンタル", "Plastic Tree"],
        ["Cassis", "the GazettE"],
        ["EDEN", "D"],
        ["alkaloid showcase", "摩天楼オペラ"],
        ["You got game?", "KIMERU"],
        ["アンインストール", "石川智晶"],
        ["真赤な誓い", "福山芳樹"],
        ["Nova Era", "Angra"],
        ["DESTINY", "GALNERYUS"],
        ["oath sign", "LiSA"],
        ["Vitalization", "水樹奈々"],
        ["サクリファイス", "まふまふ"],
        ["BALALAIKA", "9Lana"],
        ["ビバリウム", "Ado"],
        ["インフェルノ", "Mrs. GREEN APPLE"],
        ["甲賀忍法帖", "陰陽座"]
      ];

      const lightPresets = [
        ["朝焼けの航路", "rgba(255,201,99,.32)", "rgba(96,181,255,.2)", "rgba(105,181,255,.12)", "rgba(255,235,174,.42)"],
        ["冬空", "rgba(205,235,255,.32)", "rgba(120,168,255,.24)", "rgba(170,215,255,.16)", "rgba(225,245,255,.48)"],
        ["TRUE BLUE", "rgba(70,133,255,.34)", "rgba(55,214,255,.18)", "rgba(34,82,210,.2)", "rgba(131,200,255,.42)"],
        ["桜色", "rgba(255,153,204,.3)", "rgba(255,213,151,.22)", "rgba(255,180,222,.14)", "rgba(255,222,232,.46)"],
        ["春霞", "rgba(255,184,209,.28)", "rgba(255,231,179,.22)", "rgba(255,204,219,.14)", "rgba(255,239,210,.42)"],
        ["深紅", "rgba(190,37,76,.3)", "rgba(117,45,115,.22)", "rgba(105,18,61,.18)", "rgba(255,105,125,.42)"],
        ["紫の楽園", "rgba(143,79,220,.3)", "rgba(255,183,105,.18)", "rgba(92,49,150,.16)", "rgba(204,159,255,.42)"],
        ["金紫の舞台", "rgba(174,92,255,.3)", "rgba(255,192,79,.22)", "rgba(101,51,172,.16)", "rgba(243,192,116,.45)"],
        ["スタジアムブルー", "rgba(58,213,255,.3)", "rgba(78,119,255,.2)", "rgba(39,153,225,.16)", "rgba(179,238,255,.46)"],
        ["無機質な蒼", "rgba(180,221,255,.26)", "rgba(91,121,170,.22)", "rgba(87,115,160,.17)", "rgba(226,242,255,.4)"],
        ["真赤な炎", "rgba(255,65,55,.34)", "rgba(255,147,41,.25)", "rgba(173,24,20,.2)", "rgba(255,178,74,.48)"],
        ["星海", "rgba(66,105,255,.3)", "rgba(255,207,83,.2)", "rgba(42,60,161,.18)", "rgba(176,198,255,.42)"],
        ["運命の黄金", "rgba(255,205,75,.34)", "rgba(255,246,197,.2)", "rgba(186,126,25,.15)", "rgba(255,239,171,.48)"],
        ["誓いの赤青", "rgba(225,54,84,.3)", "rgba(47,108,255,.24)", "rgba(146,31,86,.18)", "rgba(220,181,255,.44)"],
        ["電光", "rgba(38,231,255,.32)", "rgba(255,63,188,.23)", "rgba(35,121,193,.17)", "rgba(173,249,255,.48)"],
        ["犠牲の紫", "rgba(105,50,151,.3)", "rgba(184,74,135,.22)", "rgba(53,31,96,.2)", "rgba(201,163,232,.4)"],
        ["ネオン", "rgba(198,44,255,.3)", "rgba(52,202,255,.22)", "rgba(102,34,162,.18)", "rgba(231,150,255,.45)"],
        ["翠の水槽", "rgba(45,214,171,.28)", "rgba(44,130,255,.22)", "rgba(29,121,136,.17)", "rgba(158,255,225,.42)"],
        ["業火", "rgba(255,64,27,.38)", "rgba(255,178,28,.26)", "rgba(185,30,12,.22)", "rgba(255,190,65,.52)"],
        ["紅月", "rgba(183,27,65,.34)", "rgba(107,50,168,.24)", "rgba(78,20,80,.2)", "rgba(255,121,144,.46)"]
      ];

      const STORAGE_KEY = "voyage-obs-state-v1";
      const CHANNEL_NAME = "voyage-obs-control-v1";
      const defaultState = { current: -1, encore: false, fx: "normal", lights: true };
      const state = loadState();
      const channel = "BroadcastChannel" in window ? new BroadcastChannel(CHANNEL_NAME) : null;

      const stage = document.getElementById("stage");
      const setlist = document.getElementById("setlist");
      const tracks = document.getElementById("tracks");
      const nowLabel = document.getElementById("nowLabel");

      function loadState() {
        try {
          return { ...defaultState, ...JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}") };
        } catch (_) {
          return { ...defaultState };
        }
      }

      function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }

      function pad(n) { return String(n + 1).padStart(2, "0"); }

      function buildList() {
        tracks.textContent = "";
        songs.forEach(([title, artist], index) => {
          const row = document.createElement("div");
          row.className = "track" + (index >= 18 ? " encore" : "");
          row.dataset.index = String(index);
          row.style.setProperty("--delay", `${Math.min(index * 42, 650)}ms`);
          row.innerHTML = `<span class="track-no">${pad(index)}</span><span class="track-copy"><span class="track-title"></span><span class="track-artist"></span></span>`;
          row.querySelector(".track-title").textContent = title;
          row.querySelector(".track-artist").textContent = artist;
          tracks.appendChild(row);
        });
      }

      function render() {
        setlist.classList.toggle("encore-open", state.encore);
        stage.classList.remove("fx-off", "fx-soft", "fx-normal");
        stage.classList.add(`fx-${state.fx}`);
        const hasVisibleCurrent = state.current >= 0 && state.current < songs.length &&
          (state.current < 18 || state.encore);
        nowLabel.classList.toggle("on", hasVisibleCurrent);
        const preset = lightPresets[Math.max(0, Math.min(state.current, lightPresets.length - 1))];
        stage.classList.toggle("lights-off", !state.lights || !hasVisibleCurrent);
        stage.style.setProperty("--light-a", preset[1]);
        stage.style.setProperty("--light-b", preset[2]);
        stage.style.setProperty("--light-top", preset[3]);
        stage.style.setProperty("--beam", preset[4]);

        document.querySelectorAll(".track").forEach((row) => {
          const index = Number(row.dataset.index);
          row.classList.toggle("done", index < state.current || state.current >= songs.length);
          row.classList.toggle("current", index === state.current && (index < 18 || state.encore));
        });
        saveState();
      }

      function applyState(nextState) {
        if (!nextState || typeof nextState !== "object") return;
        state.current = Math.max(-1, Math.min(Number(nextState.current), songs.length));
        state.encore = Boolean(nextState.encore);
        state.fx = ["off", "soft", "normal"].includes(nextState.fx) ? nextState.fx : "normal";
        state.lights = nextState.lights !== false;
        render();
      }

      function createParticles() {
        const holder = document.getElementById("particles");
        const noteChars = ["♪", "♫", "♩", "♬"];
        const random = (min, max) => Math.random() * (max - min) + min;

        for (let i = 0; i < 14; i++) {
          const p = document.createElement("span");
          p.className = "particle note";
          p.textContent = noteChars[i % noteChars.length];
          p.style.left = `${random(4, 97)}%`;
          p.style.fontSize = `${random(1.8, 4.2)}vh`;
          p.style.setProperty("--dur", `${random(12, 23)}s`);
          p.style.setProperty("--wait", `${random(-23, 0)}s`);
          p.style.setProperty("--drift", `${random(-16, 16)}vw`);
          p.style.setProperty("--spin", `${random(-260, 260)}deg`);
          p.style.setProperty("--alpha", random(.48, .9).toFixed(2));
          holder.appendChild(p);
        }
        for (let i = 0; i < 8; i++) {
          const p = document.createElement("span");
          p.className = "particle feather";
          p.style.left = `${random(2, 98)}%`;
          p.style.setProperty("--size", `${random(.7, 1.7)}vw`);
          p.style.setProperty("--dur", `${random(16, 28)}s`);
          p.style.setProperty("--wait", `${random(-28, 0)}s`);
          p.style.setProperty("--drift", `${random(-20, 20)}vw`);
          p.style.setProperty("--alpha", random(.42, .78).toFixed(2));
          holder.appendChild(p);
        }
      }

      buildList();
      createParticles();
      render();

      if (channel) {
        channel.addEventListener("message", (event) => {
          const message = event.data || {};
          if (message.type === "set-state") applyState(message.state);
          if (message.type === "request-state") {
            channel.postMessage({ type: "state", state: { ...state } });
          }
        });
        channel.postMessage({ type: "display-ready" });
      }

      window.addEventListener("storage", (event) => {
        if (event.key !== STORAGE_KEY || !event.newValue) return;
        try { applyState(JSON.parse(event.newValue)); } catch (_) {}
      });
    })();
  </script>
</body>
</html>
