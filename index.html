<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#12051d">

  <title>齋藤村</title>
  <meta name="application-name" content="齋藤村">
  <meta name="apple-mobile-web-app-title" content="齋藤村">

  <!-- Webのまま開くため standalone 指定は入れていません -->
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png">

  <style>
    :root {
      color-scheme: dark;
      --gold: #f2cf78;
      --gold-soft: #f9e6b0;
      --purple: #7d35b8;
      --bg1: #0b0311;
      --bg2: #180824;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 50% 18%, rgba(122,51,181,.28), transparent 32%),
        radial-gradient(circle at 18% 78%, rgba(242,207,120,.08), transparent 26%),
        linear-gradient(180deg, var(--bg2), var(--bg1));
      color: #fff;
      font-family:
        -apple-system, BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic", sans-serif;
    }

    body {
      min-height: 100svh;
      overflow-x: hidden;
    }

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .55;
      background-image:
        radial-gradient(circle at 8% 12%, rgba(255,255,255,.8) 0 1px, transparent 1.5px),
        radial-gradient(circle at 23% 33%, rgba(255,255,255,.5) 0 1px, transparent 1.4px),
        radial-gradient(circle at 81% 18%, rgba(255,255,255,.7) 0 1px, transparent 1.4px),
        radial-gradient(circle at 71% 66%, rgba(255,255,255,.45) 0 1px, transparent 1.5px),
        radial-gradient(circle at 35% 82%, rgba(242,207,120,.5) 0 1px, transparent 1.5px);
      background-size: 170px 190px, 240px 210px, 200px 240px, 260px 180px, 220px 260px;
    }

    main {
      position: relative;
      z-index: 1;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding:
        max(26px, env(safe-area-inset-top))
        24px
        max(30px, env(safe-area-inset-bottom));
    }

    .gate {
      width: min(100%, 430px);
      text-align: center;
    }

    .icon-wrap {
      width: 148px;
      height: 148px;
      margin: 0 auto 20px;
      border-radius: 34px;
      padding: 7px;
      background:
        linear-gradient(145deg, rgba(242,207,120,.95), rgba(151,86,211,.55), rgba(242,207,120,.72));
      box-shadow:
        0 0 38px rgba(158,77,225,.28),
        0 16px 50px rgba(0,0,0,.38);
    }

    .icon-wrap img {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 28px;
      object-fit: cover;
    }

    .eyebrow {
      margin-top: 8px;
      color: rgba(242,207,120,.74);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .32em;
    }

    h1 {
      margin: 11px 0 0;
      font-family:
        "Yu Mincho",
        "Hiragino Mincho ProN",
        serif;
      font-size: clamp(34px, 9vw, 52px);
      font-weight: 700;
      letter-spacing: .08em;
      color: #fff9ee;
      text-shadow:
        0 0 20px rgba(155,79,221,.46),
        0 4px 20px rgba(0,0,0,.55);
    }

    .sub {
      margin-top: 9px;
      color: rgba(255,255,255,.58);
      font-size: 12px;
      letter-spacing: .12em;
      line-height: 1.8;
    }

    .divider {
      width: 74%;
      height: 1px;
      margin: 25px auto;
      background:
        linear-gradient(90deg, transparent, rgba(242,207,120,.42), transparent);
    }

    .enter {
      width: min(100%, 330px);
      min-height: 58px;
      border: 1px solid rgba(242,207,120,.82);
      border-radius: 999px;
      color: #fff8eb;
      background:
        linear-gradient(135deg, #6f2aa8, #9d47d4);
      box-shadow:
        0 14px 34px rgba(89,24,136,.42),
        0 0 24px rgba(178,92,239,.22),
        inset 0 1px 0 rgba(255,255,255,.20);
      font: inherit;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .08em;
      cursor: pointer;
    }

    .enter:active {
      transform: scale(.985);
    }

    .help {
      margin: 16px auto 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: rgba(255,247,232,.58);
      font: inherit;
      font-size: 11px;
      letter-spacing: .07em;
      cursor: pointer;
    }

    .help:active {
      color: rgba(242,207,120,.9);
    }

    .hint {
      margin-top: 28px;
      color: rgba(255,255,255,.38);
      font-size: 10px;
      line-height: 1.7;
    }

    dialog {
      width: min(calc(100% - 32px), 390px);
      border: 1px solid rgba(242,207,120,.25);
      border-radius: 24px;
      padding: 0;
      color: #fff;
      background:
        radial-gradient(circle at 50% 0%, rgba(130,63,189,.28), transparent 40%),
        linear-gradient(165deg, #25103a, #0f0719);
      box-shadow: 0 24px 80px rgba(0,0,0,.60);
    }

    dialog::backdrop {
      background: rgba(5,2,10,.78);
      backdrop-filter: blur(8px);
    }

    .modal {
      padding: 28px 22px 22px;
      text-align: center;
    }

    .modal h2 {
      margin: 5px 0 18px;
      font-family: "Yu Mincho","Hiragino Mincho ProN",serif;
      font-size: 22px;
      letter-spacing: .06em;
    }

    .steps {
      display: grid;
      gap: 10px;
      text-align: left;
    }

    .step {
      display: grid;
      grid-template-columns: 30px 1fr;
      gap: 11px;
      padding: 13px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 15px;
      background: rgba(255,255,255,.045);
    }

    .num {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(242,207,120,.13);
      color: var(--gold-soft);
      font-size: 12px;
      font-weight: 800;
    }

    .step div:last-child {
      padding-top: 2px;
      color: rgba(255,255,255,.82);
      font-size: 13px;
      line-height: 1.7;
    }

    .close {
      width: 100%;
      min-height: 48px;
      margin-top: 18px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 999px;
      color: rgba(255,255,255,.82);
      background: rgba(255,255,255,.06);
      font: inherit;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="stars" aria-hidden="true"></div>

  <main>
    <section class="gate">
      <div class="icon-wrap">
        <img src="./icon-512.png" alt="齋藤村">
      </div>

      <div class="eyebrow">SAITO VILLAGE GATE</div>
      <h1>齋藤村</h1>
      <div class="sub">
        この先、齋藤村。<br>
        村へ入りますか？
      </div>

      <div class="divider"></div>

      <button class="enter" type="button" onclick="enterVillage()">
        ⛩️ 齋藤村へ入村する
      </button>

      <button class="help" type="button" onclick="openHomeGuide()">
        ⌂ ホーム画面から入村するには？
      </button>

      <div class="hint">
        アプリのインストールは不要です。<br>
        齋藤村ポータルはWebで開きます。
      </div>
    </section>
  </main>

  <dialog id="homeGuide">
    <div class="modal">
      <div style="font-size:34px">🌙</div>
      <h2>ホーム画面に入口を追加</h2>

      <div class="steps">
        <div class="step">
          <div class="num">1</div>
          <div>Safariの<strong>共有</strong>をタップします。</div>
        </div>

        <div class="step">
          <div class="num">2</div>
          <div><strong>「ホーム画面に追加」</strong>を選びます。</div>
        </div>

        <div class="step">
          <div class="num">3</div>
          <div>名前が<strong>「齋藤村」</strong>になっていることを確認して追加します。</div>
        </div>
      </div>

      <button class="close" type="button" onclick="closeHomeGuide()">
        閉じる
      </button>
    </div>
  </dialog>

  <script>
    const PORTAL_URL = 'https://script.google.com/macros/s/AKfycbx_dZMFQRttoa1-L8irGyt3n04S5Y3JXH0swirg9SS0n1LmQKWhweCvPSpjj1YyAA99/exec';

    function enterVillage() {
      window.location.href = PORTAL_URL;
    }

    function openHomeGuide() {
      const dialog = document.getElementById("homeGuide");
      if (dialog && typeof dialog.showModal === "function") {
        dialog.showModal();
      }
    }

    function closeHomeGuide() {
      const dialog = document.getElementById("homeGuide");
      if (dialog) dialog.close();
    }
  </script>
</body>
</html>
