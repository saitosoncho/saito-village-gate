<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#12051d"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <title>齋藤村</title>

  <meta
    name="application-name"
    content="齋藤村"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="齋藤村"
  >

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="./apple-touch-icon.png"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="64x64"
    href="./favicon.png"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #12051d;
    }

    body {
      min-height: 100svh;
    }

    #villagePortal,
    #villageFacility {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      border: 0;
      display: block;

      background: #12051d;
    }

    #villagePortal {
      z-index: 1;
    }

    #villageFacility {
      z-index: 2;
    }

    .village-frame-hidden {
      visibility: hidden;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <iframe
    id="villagePortal"
    title="齋藤村"
    allow="clipboard-read; clipboard-write"
  ></iframe>

  <iframe
    id="villageFacility"
    class="village-frame-hidden"
    title="齋藤村の施設"
    allow="clipboard-read; clipboard-write"
  ></iframe>

  <script>
    (function() {

      const GAS_PORTAL_URL =
        "https://script.google.com/macros/s/AKfycbx_dZMFQRttoa1-L8irGyt3n04S5Y3JXH0swirg9SS0n1LmQKWhweCvPSpjj1YyAA99/exec";

      const RESIDENT_STORAGE_KEY =
        "saitoVillageResidentNo";

      const ANNIVERSARY_AUTH_STORAGE_KEY =
        "saitoAnniversaryOuterAuth";

      const ACTIVE_VIEW_STORAGE_KEY =
        "saitoVillageActiveView";

      const ANNIVERSARY_URL_STORAGE_KEY =
        "saitoAnniversaryBaseUrl";

      const portalFrame =
        document.getElementById(
          "villagePortal"
        );

      const facilityFrame =
        document.getElementById(
          "villageFacility"
        );

      let activeFacilityType = "";
      let pendingFacilityType = "";
      let pendingFacilityUrl = "";
      let facilityNavigationSerial = 0;

      /*
       * 一周年サイト二重読込防止ロック
       * Portalへ戻るまで、同じ入場要求を1回だけ受け付ける。
       */
      let anniversaryOpenLocked = false;

      const bridgeToken =
        (
          window.crypto &&
          typeof window.crypto.randomUUID ===
            "function"
        )

          ? window.crypto.randomUUID()

          : (
              Date.now().toString(36) +
              "-" +
              Math.random().toString(36).slice(2) +
              Math.random().toString(36).slice(2)
            );


      function normalizeResidentNo(
        residentNo
      ) {

        residentNo =
          String(
            residentNo || ""
          ).trim();

        return /^SV-\d{6}$/.test(
          residentNo
        )

          ? residentNo

          : "";

      }


      function getStoredResidentNo() {

        try {

          return normalizeResidentNo(

            localStorage.getItem(
              RESIDENT_STORAGE_KEY
            )

          );

        }
        catch (error) {

          console.warn(
            "村民情報を読み込めませんでした。",
            error
          );

          return "";

        }

      }


      function openVillagePortal() {

        const residentNo =
          getStoredResidentNo();

        const portalUrl =
          new URL(
            GAS_PORTAL_URL
          );

        portalUrl.searchParams.set(
          "bridgeToken",
          bridgeToken
        );

        if (residentNo) {

          portalUrl.searchParams.set(
            "resident",
            residentNo
          );

        }

        portalFrame.src =
          portalUrl.toString();

        portalFrame.classList.remove(
          "village-frame-hidden"
        );

        facilityFrame.classList.add(
          "village-frame-hidden"
        );

      }


      function isAllowedAnniversaryUrl(
        value
      ) {

        try {

          const url = new URL(
            String(value || "")
          );

          return (
            url.protocol === "https:" &&
            url.hostname === "script.google.com" &&
            url.pathname.startsWith(
              "/macros/s/"
            )
          );

        }
        catch (error) {

          return false;

        }

      }


      function createAnniversaryFrameUrl(
        value
      ) {

        if (!isAllowedAnniversaryUrl(value)) {

          return "";

        }

        const url = new URL(value);

        url.searchParams.set(
          "bridgeToken",
          bridgeToken
        );

        return url.toString();

      }


      function createAnniversaryBaseUrl(
        value
      ) {

        if (!isAllowedAnniversaryUrl(value)) {

          return "";

        }

        const url = new URL(value);

        [
          "resident",
          "residentNo",
          "token",
          "signature",
          "timestamp",
          "handoff",
          "sig",
          "bridgeToken"
        ].forEach(
          function(parameterName) {

            url.searchParams.delete(
              parameterName
            );

          }
        );

        return url.toString();

      }


      function notifyPortalResumed_() {

        try {

          if (
            portalFrame.contentWindow &&
            typeof portalFrame.contentWindow.postMessage ===
              "function"
          ) {

            portalFrame.contentWindow.postMessage(
              {
                type:
                  "SAITO_VILLAGE_PORTAL_RESUMED",
                bridgeToken:
                  bridgeToken
              },
              "*"
            );

          }

        }
        catch (error) {

          console.warn(
            "ポータルの復帰通知に失敗しました。",
            error
          );

        }

      }


      function resetFacilityFrame_() {

        pendingFacilityType = "";
        pendingFacilityUrl = "";
        activeFacilityType = "";

        /*
         * Portalへ戻った時点で、次回の一周年祭入場を許可する。
         */
        anniversaryOpenLocked = false;

        facilityNavigationSerial += 1;

        facilityFrame.classList.add(
          "village-frame-hidden"
        );

        /*
         * 直前の施設DOM・退場オーバーレイを完全に破棄する。
         * 次の施設を同じiframeへ読み込む際に、
         * 前施設の画面が一瞬見える現象を防ぐ。
         */
        window.setTimeout(
          function() {

            try {

              facilityFrame.src =
                "about:blank";

            }
            catch (error) {

              console.warn(
                "施設フレームを初期化できませんでした。",
                error
              );

            }

          },
          40
        );

      }


      function showPortalFrame_() {

        resetFacilityFrame_();

        portalFrame.classList.remove(
          "village-frame-hidden"
        );

        notifyPortalResumed_();

      }


      function loadFacilityFrame_(
        targetUrl,
        facilityType
      ) {

        targetUrl =
          String(
            targetUrl || ""
          ).trim();

        facilityType =
          String(
            facilityType || ""
          ).trim();

        if (!targetUrl) {

          return false;

        }

        const serial =
          ++facilityNavigationSerial;

        pendingFacilityType =
          facilityType;

        pendingFacilityUrl =
          targetUrl;

        /*
         * 新施設のload完了まではPortalを表示したままにする。
         * Portal側の約4秒入場演出がそのまま読み込みを覆うため、
         * 古い施設フレームが表へ出ることはない。
         */
        facilityFrame.classList.add(
          "village-frame-hidden"
        );

        facilityFrame.onload =
          function() {

            if (
              serial !==
                facilityNavigationSerial ||
              !pendingFacilityUrl
            ) {

              return;

            }

            activeFacilityType =
              pendingFacilityType;

            pendingFacilityType = "";
            pendingFacilityUrl = "";

            portalFrame.classList.add(
              "village-frame-hidden"
            );

            facilityFrame.classList.remove(
              "village-frame-hidden"
            );

          };

        facilityFrame.src =
          targetUrl;

        return true;

      }


      function showFacilityUrl(
        value
      ) {

        const targetUrl =
          createAnniversaryFrameUrl(value);

        if (!targetUrl) {

          return false;

        }

        /*
         * スマホ環境などで同じ一周年祭入場要求が重複して届いても、
         * facility iframe の src を二度設定しない。
         *
         * ここでは true を返して「要求自体は処理済み」と扱うことで、
         * 呼び出し元の保存処理は従来どおり継続できる。
         */
        if (anniversaryOpenLocked) {

          return true;

        }

        anniversaryOpenLocked = true;

        const loaded =
          loadFacilityFrame_(
            targetUrl,
            "anniversary"
          );

        if (!loaded) {

          anniversaryOpenLocked = false;

        }

        return loaded;

      }


      function getStoredAnniversaryAuth() {

        try {

          const storedValue =
            localStorage.getItem(
              ANNIVERSARY_AUTH_STORAGE_KEY
            );

          if (!storedValue) {

            return null;

          }

          const parsedValue =
            JSON.parse(storedValue);

          const authSessionToken =
            String(
              parsedValue.authSessionToken || ""
            ).trim();

          if (
            authSessionToken.length < 8 ||
            authSessionToken.length > 4096
          ) {

            return null;

          }

          return {
            authSessionToken:
              authSessionToken,
            residentNo:
              String(
                parsedValue.residentNo || ""
              ).trim(),
            residentName:
              String(
                parsedValue.residentName || ""
              ).trim()
          };

        }
        catch (error) {

          console.warn(
            "一周年祭の認証情報を読み込めませんでした。",
            error
          );

          return null;

        }

      }


      function restoreInitialView() {

        try {

          const activeView =
            localStorage.getItem(
              ACTIVE_VIEW_STORAGE_KEY
            );

          const anniversaryUrl =
            localStorage.getItem(
              ANNIVERSARY_URL_STORAGE_KEY
            );

          if (
            activeView === "anniversary" &&
            anniversaryUrl &&
            getStoredAnniversaryAuth()
          ) {

            return showFacilityUrl(
              anniversaryUrl
            );

          }

        }
        catch (error) {

          console.warn(
            "前回の表示状態を復元できませんでした。",
            error
          );

        }

        return false;

      }


      window.addEventListener(

        "message",

        function(event) {

          /*
           * iPhoneではGASの送信元がnullになる場合があるため、
           * GitHub側が起動時に発行した一時トークンで確認します。
           */

          const data =
            event.data || {};

          /*
           * Apps Script側でURLパラメータを取得できない場合に備え、
           * 現在表示中の一周年祭へ通信キーを直接返します。
           */
          if (
            data.type ===
              "SAITO_ANNIVERSARY_BRIDGE_HELLO" &&
            activeFacilityType ===
              "anniversary" &&
            event.source &&
            typeof event.source.postMessage ===
              "function"
          ) {

            event.source.postMessage(
              {
                type:
                  "SAITO_ANNIVERSARY_BRIDGE_READY",
                bridgeToken:
                  bridgeToken
              },
              "*"
            );

            return;

          }

          if (
            !data.bridgeToken ||
            data.bridgeToken !==
              bridgeToken
          ) {

            return;

          }

          if (
            data.type ===
            "SAITO_VILLAGE_SAVE_RESIDENT"
          ) {

            const residentNo =
              normalizeResidentNo(
                data.residentNo
              );

            if (!residentNo) {

              return;

            }

            try {

              localStorage.setItem(

                RESIDENT_STORAGE_KEY,

                residentNo

              );

            }
            catch (error) {

              console.warn(
                "村民情報を保存できませんでした。",
                error
              );

            }

            return;

          }

          if (
            data.type ===
            "SAITO_VILLAGE_OPEN_URL"
          ) {

            const baseUrl =
              createAnniversaryBaseUrl(
                data.url
              );

            if (!baseUrl) {

              return;

            }

            if (!showFacilityUrl(data.url)) {

              return;

            }

            try {

              localStorage.setItem(
                ANNIVERSARY_URL_STORAGE_KEY,
                baseUrl
              );

              localStorage.setItem(
                ACTIVE_VIEW_STORAGE_KEY,
                "anniversary"
              );

            }
            catch (error) {

              console.warn(
                "一周年祭の表示状態を保存できませんでした。",
                error
              );

            }

            return;

          }

          if (
            data.type ===
            "SAITO_ANNIVERSARY_SAVE_AUTH"
          ) {

            const authSessionToken =
              String(
                data.authSessionToken || ""
              ).trim();

            if (
              authSessionToken.length < 8 ||
              authSessionToken.length > 4096
            ) {

              return;

            }

            try {

              localStorage.setItem(
                ANNIVERSARY_AUTH_STORAGE_KEY,
                JSON.stringify({
                  authSessionToken:
                    authSessionToken,
                  residentNo:
                    String(
                      data.residentNo || ""
                    ).trim(),
                  residentName:
                    String(
                      data.residentName || ""
                    ).trim()
                })
              );

            }
            catch (error) {

              console.warn(
                "一周年祭の認証情報を保存できませんでした。",
                error
              );

            }

            return;

          }

          if (
            data.type ===
            "SAITO_ANNIVERSARY_REQUEST_AUTH"
          ) {

            const storedAuth =
              getStoredAnniversaryAuth();

            if (
              event.source &&
              typeof event.source.postMessage ===
                "function"
            ) {

              event.source.postMessage(
                {
                  type:
                    "SAITO_ANNIVERSARY_AUTH_STATE",
                  bridgeToken:
                    bridgeToken,
                  authSessionToken:
                    storedAuth
                      ? storedAuth.authSessionToken
                      : "",
                  residentNo:
                    storedAuth
                      ? storedAuth.residentNo
                      : "",
                  residentName:
                    storedAuth
                      ? storedAuth.residentName
                      : ""
                },
                "*"
              );

            }

            return;

          }

          if (
            data.type ===
            "SAITO_ANNIVERSARY_CLEAR_AUTH"
          ) {

            try {

              localStorage.removeItem(
                ANNIVERSARY_AUTH_STORAGE_KEY
              );

            }
            catch (error) {

              console.warn(
                "一周年祭の認証情報を削除できませんでした。",
                error
              );

            }

            return;

          }

          if (
            data.type ===
            "SAITO_VILLAGE_CLEAR_RESIDENT"
          ) {

            try {

              localStorage.removeItem(
                RESIDENT_STORAGE_KEY
              );

            }
            catch (error) {

              console.warn(
                "村民情報を削除できませんでした。",
                error
              );

            }

            return;

          }

          if (
            data.type ===
            "SAITO_VILLAGE_NAVIGATE"
          ) {

            const allowedPages =
              [
                "portal",
                "fishing",
                "bar",
                "notebook",
                "exploration",
                "utsushimi",
                "janken",
                "memorial"
              ];

            const page =
              String(
                data.page || "portal"
              ).trim();

            if (
              !allowedPages.includes(page)
            ) {

              return;

            }

            const residentNo =
              normalizeResidentNo(
                data.residentNo
              ) ||
              getStoredResidentNo();

            const residentName =
              String(
                data.residentName || ""
              ).trim();

            const targetUrl =
              new URL(
                GAS_PORTAL_URL
              );

            if (page === "portal") {

              showPortalFrame_();

              try {

                localStorage.setItem(
                  ACTIVE_VIEW_STORAGE_KEY,
                  "portal"
                );

              }
              catch (error) {

                console.warn(
                  "表示状態を保存できませんでした。",
                  error
                );

              }

              return;

            }

            targetUrl.searchParams.set(
              "page",
              page
            );

            targetUrl.searchParams.set(
              "bridgeToken",
              bridgeToken
            );

            if (residentNo) {

              targetUrl.searchParams.set(
                "resident",
                residentNo
              );

            }

            if (residentName) {

              targetUrl.searchParams.set(
                "residentName",
                residentName
              );

            }

            loadFacilityFrame_(
              targetUrl.toString(),
              page
            );

          }

        }

      );


      /*
       * 入村口URLから外枠を新しく開いた場合は、
       * 前回閉じた時の施設表示を復元せず、必ずPortalから開始する。
       *
       * 村民番号・一周年認証情報などは消さない。
       * 村内での施設移動／施設からPortalへの帰村処理も従来どおり。
       */
      openVillagePortal();

      try {

        localStorage.setItem(
          ACTIVE_VIEW_STORAGE_KEY,
          "portal"
        );

      }
      catch (error) {

        console.warn(
          "初回表示状態をPortalへ設定できませんでした。",
          error
        );

      }

    })();
  </script>

</body>
</html>
