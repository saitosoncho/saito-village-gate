<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#12051d"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <title>齋藤村</title>

  <meta
    name="application-name"
    content="齋藤村"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="齋藤村"
  >

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="./apple-touch-icon.png"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="64x64"
    href="./favicon.png"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #12051d;
    }

    body {
      min-height: 100svh;
    }

    #villagePortal,
    #villageFacility {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      border: 0;
      display: block;

      background: #12051d;
    }

    #villagePortal {
      z-index: 1;
    }

    #villageFacility {
      z-index: 2;
    }

    .village-frame-hidden {
      visibility: hidden;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <iframe
    id="villagePortal"
    title="齋藤村"
    allow="clipboard-read; clipboard-write"
  ></iframe>

  <iframe
    id="villageFacility"
    class="village-frame-hidden"
    title="齋藤村の施設"
    allow="clipboard-read; clipboard-write"
  ></iframe>

  <script>
    (function() {

      const GAS_PORTAL_URL =
        "https://script.google.com/macros/s/AKfycbx_dZMFQRttoa1-L8irGyt3n04S5Y3JXH0swirg9SS0n1LmQKWhweCvPSpjj1YyAA99/exec";

      const RESIDENT_STORAGE_KEY =
        "saitoVillageResidentNo";

      const ANNIVERSARY_AUTH_STORAGE_KEY =
        "saitoAnniversaryOuterAuth";

      const ACTIVE_VIEW_STORAGE_KEY =
        "saitoVillageActiveView";

      const ANNIVERSARY_URL_STORAGE_KEY =
        "saitoAnniversaryBaseUrl";

      const portalFrame =
        document.getElementById(
          "villagePortal"
        );

      const facilityFrame =
        document.getElementById(
          "villageFacility"
        );

      let activeFacilityType = "";

      const bridgeToken =
        (
          window.crypto &&
          typeof window.crypto.randomUUID ===
            "function"
        )

          ? window.crypto.randomUUID()

          : (
              Date.now().toString(36) +
              "-" +
              Math.random().toString(36).slice(2) +
              Math.random().toString(36).slice(2)
            );


      function normalizeResidentNo(
        residentNo
      ) {

        residentNo =
          String(
            residentNo || ""
          ).trim();

        return /^SV-\d{6}$/.test(
          residentNo
        )

          ? residentNo

          : "";

      }


      function getStoredResidentNo() {

        try {

          return normalizeResidentNo(

            localStorage.getItem(
              RESIDENT_STORAGE_KEY
            )

          );

        }
        catch (error) {

          console.warn(
            "村民情報を読み込めませんでした。",
            error
          );

          return "";

        }

      }


      function openVillagePortal() {

        const residentNo =
          getStoredResidentNo();

        const portalUrl =
          new URL(
            GAS_PORTAL_URL
          );

        portalUrl.searchParams.set(
          "bridgeToken",
          bridgeToken
        );

        if (residentNo) {

          portalUrl.searchParams.set(
            "resident",
            residentNo
          );

        }

        portalFrame.src =
          portalUrl.toString();

        portalFrame.classList.remove(
          "village-frame-hidden"
        );

        facilityFrame.classList.add(
          "village-frame-hidden"
        );

      }


      function isAllowedAnniversaryUrl(
        value
      ) {

        try {

          const url = new URL(
            String(value || "")
          );

          return (
            url.protocol === "https:" &&
            url.hostname === "script.google.com" &&
            url.pathname.startsWith(
              "/macros/s/"
            )
          );

        }
        catch (error) {

          return false;

        }

      }


      function createAnniversaryFrameUrl(
        value
      ) {

        if (!isAllowedAnniversaryUrl(value)) {

          return "";

        }

        const url = new URL(value);

        url.searchParams.set(
          "bridgeToken",
          bridgeToken
        );

        return url.toString();

      }


      function createAnniversaryBaseUrl(
        value
      ) {

        if (!isAllowedAnniversaryUrl(value)) {

          return "";

        }

        const url = new URL(value);

        [
          "resident",
          "residentNo",
          "token",
          "signature",
          "timestamp",
          "handoff",
          "sig",
          "bridgeToken"
        ].forEach(
          function(parameterName) {

            url.searchParams.delete(
              parameterName
            );

          }
        );

        return url.toString();

      }


      function showFacilityUrl(
        value
      ) {

        const targetUrl =
          createAnniversaryFrameUrl(value);

        if (!targetUrl) {

          return false;

        }

        facilityFrame.src = targetUrl;

        activeFacilityType =
          "anniversary";

        portalFrame.classList.add(
          "village-frame-hidden"
        );

        facilityFrame.classList.remove(
          "village-frame-hidden"
        );

        return true;

      }


      function getStoredAnniversaryAuth() {

        try {

          const storedValue =
            localStorage.getItem(
              ANNIVERSARY_AUTH_STORAGE_KEY
            );

          if (!storedValue) {

            return null;

          }

          const parsedValue =
            JSON.parse(storedValue);

          const authSessionToken =
            String(
              parsedValue.authSessionToken || ""
            ).trim();

          if (
            authSessionToken.length < 8 ||
            authSessionToken.length > 4096
          ) {

            return null;

          }

          return {
            authSessionToken:
              authSessionToken,
            residentNo:
              String(
                parsedValue.residentNo || ""
              ).trim(),
            residentName:
              String(
                parsedValue.residentName || ""
              ).trim()
          };

        }
        catch (error) {

          console.warn(
            "一周年祭の認証情報を読み込めませんでした。",
            error
          );

          return null;

        }

      }


      function restoreInitialView() {

        try {

          const activeView =
            localStorage.getItem(
              ACTIVE_VIEW_STORAGE_KEY
            );

          const anniversaryUrl =
            localStorage.getItem(
              ANNIVERSARY_URL_STORAGE_KEY
            );

          if (
            activeView === "anniversary" &&
            anniversaryUrl &&
            getStoredAnniversaryAuth()
          ) {

            return showFacilityUrl(
              anniversaryUrl
            );

          }

        }
        catch (error) {

          console.warn(
            "前回の表示状態を復元できませんでした。",
            error
          );

        }

        return false;

      }


      window.addEventListener(

        "message",

        function(event) {

          /*
           * iPhoneではGASの送信元がnullになる場合があるため、
           * GitHub側が起動時に発行した一時トークンで確認します。
           */

          const data =
            event.data || {};

          /*
           * Apps Script側でURLパラメータを取得できない場合に備え、
           * 現在表示中の一周年祭へ通信キーを直接返します。
           */
          if (
            data.type ===
              "SAITO_ANNIVERSARY_BRIDGE_HELLO" &&
            activeFacilityType ===
              "anniversary" &&
            event.source &&
            typeof event.source.postMessage ===
              "function"
          ) {

            event.source.postMessage(
              {
                type:
                  "SAITO_ANNIVERSARY_BRIDGE_READY",
                bridgeToken:
                  bridgeToken
              },
              "*"
            );

            return;

          }

          if (
            !data.bridgeToken ||
            data.bridgeToken !==
              bridgeToken
          ) {

            return;

          }

          if (
            data.type ===
            "SAITO_VILLAGE_SAVE_RESIDENT"
          ) {

            const residentNo =
              normalizeResidentNo(
                data.residentNo
              );

            if (!residentNo) {

              return;

            }

            try {

              localStorage.setItem(

                RESIDENT_STORAGE_KEY,

                residentNo

              );

            }
            catch (error) {

              console.warn(
                "村民情報を保存できませんでした。",
                error
              );

            }

            return;

          }

          if (
            data.type ===
            "SAITO_VILLAGE_OPEN_URL"
          ) {

            const baseUrl =
              createAnniversaryBaseUrl(
                data.url
              );

            if (!baseUrl) {

              return;

            }

            if (!showFacilityUrl(data.url)) {

              return;

            }

            try {

              localStorage.setItem(
                ANNIVERSARY_URL_STORAGE_KEY,
                baseUrl
              );

              localStorage.setItem(
                ACTIVE_VIEW_STORAGE_KEY,
                "anniversary"
              );

            }
            catch (error) {

              console.warn(
                "一周年祭の表示状態を保存できませんでした。",
                error
              );

            }

            return;

          }

          if (
            data.type ===
            "SAITO_ANNIVERSARY_SAVE_AUTH"
          ) {

            const authSessionToken =
              String(
                data.authSessionToken || ""
              ).trim();

            if (
              authSessionToken.length < 8 ||
              authSessionToken.length > 4096
            ) {

              return;

            }

            try {

              localStorage.setItem(
                ANNIVERSARY_AUTH_STORAGE_KEY,
                JSON.stringify({
                  authSessionToken:
                    authSessionToken,
                  residentNo:
                    String(
                      data.residentNo || ""
                    ).trim(),
                  residentName:
                    String(
                      data.residentName || ""
                    ).trim()
                })
              );

            }
            catch (error) {

              console.warn(
                "一周年祭の認証情報を保存できませんでした。",
                error
              );

            }

            return;

          }

          if (
            data.type ===
            "SAITO_ANNIVERSARY_REQUEST_AUTH"
          ) {

            const storedAuth =
              getStoredAnniversaryAuth();

            if (
              event.source &&
              typeof event.source.postMessage ===
                "function"
            ) {

              event.source.postMessage(
                {
                  type:
                    "SAITO_ANNIVERSARY_AUTH_STATE",
                  bridgeToken:
                    bridgeToken,
                  authSessionToken:
                    storedAuth
                      ? storedAuth.authSessionToken
                      : "",
                  residentNo:
                    storedAuth
                      ? storedAuth.residentNo
                      : "",
                  residentName:
                    storedAuth
                      ? storedAuth.residentName
                      : ""
                },
                "*"
              );

            }

            return;

          }

          if (
            data.type ===
            "SAITO_ANNIVERSARY_CLEAR_AUTH"
          ) {

            try {

              localStorage.removeItem(
                ANNIVERSARY_AUTH_STORAGE_KEY
              );

            }
            catch (error) {

              console.warn(
                "一周年祭の認証情報を削除できませんでした。",
                error
              );

            }

            return;

          }

          if (
            data.type ===
            "SAITO_VILLAGE_CLEAR_RESIDENT"
          ) {

            try {

              localStorage.removeItem(
                RESIDENT_STORAGE_KEY
              );

            }
            catch (error) {

              console.warn(
                "村民情報を削除できませんでした。",
                error
              );

            }

            return;

          }

          if (
            data.type ===
            "SAITO_VILLAGE_NAVIGATE"
          ) {

            const allowedPages =
              [
                "portal",
                "fishing",
                "bar",
                "notebook",
                "exploration",
                "utsushimi",
                "janken",
                "memorial"
              ];

            const page =
              String(
                data.page || "portal"
              ).trim();

            if (
              !allowedPages.includes(page)
            ) {

              return;

            }

            const residentNo =
              normalizeResidentNo(
                data.residentNo
              ) ||
              getStoredResidentNo();

            const residentName =
              String(
                data.residentName || ""
              ).trim();

            const targetUrl =
              new URL(
                GAS_PORTAL_URL
              );

            if (page === "portal") {

              activeFacilityType = "";

              facilityFrame.classList.add(
                "village-frame-hidden"
              );

              portalFrame.classList.remove(
                "village-frame-hidden"
              );

              try {

                localStorage.setItem(
                  ACTIVE_VIEW_STORAGE_KEY,
                  "portal"
                );

              }
              catch (error) {

                console.warn(
                  "表示状態を保存できませんでした。",
                  error
                );

              }

              return;

            }

            targetUrl.searchParams.set(
              "page",
              page
            );

            targetUrl.searchParams.set(
              "bridgeToken",
              bridgeToken
            );

            if (residentNo) {

              targetUrl.searchParams.set(
                "resident",
                residentNo
              );

            }

            if (residentName) {

              targetUrl.searchParams.set(
                "residentName",
                residentName
              );

            }

            facilityFrame.src =
              targetUrl.toString();

            portalFrame.classList.add(
              "village-frame-hidden"
            );

            facilityFrame.classList.remove(
              "village-frame-hidden"
            );

          }

        }

      );


      openVillagePortal();

      if (!restoreInitialView()) {

        try {

          localStorage.setItem(
            ACTIVE_VIEW_STORAGE_KEY,
            "portal"
          );

        }
        catch (error) {

          console.warn(
            "表示状態を保存できませんでした。",
            error
          );

        }

      }

    })();
  </script>

</body>
</html>
