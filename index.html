<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#12051d"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <title>齋藤村</title>

  <meta
    name="application-name"
    content="齋藤村"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="齋藤村"
  >

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="./apple-touch-icon.png"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="64x64"
    href="./favicon.png"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #12051d;
    }

    body {
      min-height: 100svh;
    }

    #villagePortal,
    #villageFacility {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      border: 0;
      display: block;

      background: #12051d;
    }

    #villagePortal {
      z-index: 1;
    }

    #villageFacility {
      z-index: 2;
    }

    .village-frame-hidden {
      visibility: hidden;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <iframe
    id="villagePortal"
    title="齋藤村"
    allow="clipboard-read; clipboard-write"
  ></iframe>

  <iframe
    id="villageFacility"
    class="village-frame-hidden"
    title="齋藤村の施設"
    allow="clipboard-read; clipboard-write"
  ></iframe>

  <script>
    (function() {

      const GAS_PORTAL_URL =
        "https://script.google.com/macros/s/AKfycbx_dZMFQRttoa1-L8irGyt3n04S5Y3JXH0swirg9SS0n1LmQKWhweCvPSpjj1YyAA99/exec";

      const RESIDENT_STORAGE_KEY =
        "saitoVillageResidentNo";

      const portalFrame =
        document.getElementById(
          "villagePortal"
        );

      const facilityFrame =
        document.getElementById(
          "villageFacility"
        );

      const bridgeToken =
        (
          window.crypto &&
          typeof window.crypto.randomUUID ===
            "function"
        )

          ? window.crypto.randomUUID()

          : (
              Date.now().toString(36) +
              "-" +
              Math.random().toString(36).slice(2) +
              Math.random().toString(36).slice(2)
            );


      function normalizeResidentNo(
        residentNo
      ) {

        residentNo =
          String(
            residentNo || ""
          ).trim();

        return /^SV-\d{6}$/.test(
          residentNo
        )

          ? residentNo

          : "";

      }


      function getStoredResidentNo() {

        try {

          return normalizeResidentNo(

            localStorage.getItem(
              RESIDENT_STORAGE_KEY
            )

          );

        }
        catch (error) {

          console.warn(
            "村民情報を読み込めませんでした。",
            error
          );

          return "";

        }

      }


      function openVillagePortal() {

        const residentNo =
          getStoredResidentNo();

        const portalUrl =
          new URL(
            GAS_PORTAL_URL
          );

        portalUrl.searchParams.set(
          "bridgeToken",
          bridgeToken
        );

        if (residentNo) {

          portalUrl.searchParams.set(
            "resident",
            residentNo
          );

        }

        portalFrame.src =
          portalUrl.toString();

        portalFrame.classList.remove(
          "village-frame-hidden"
        );

        facilityFrame.classList.add(
          "village-frame-hidden"
        );

      }


      window.addEventListener(

        "message",

        function(event) {

          /*
           * iPhoneではGASの送信元がnullになる場合があるため、
           * GitHub側が起動時に発行した一時トークンで確認します。
           */

          const data =
            event.data || {};

          if (
            !data.bridgeToken ||
            data.bridgeToken !==
              bridgeToken
          ) {

            return;

          }

          if (
            data.type ===
            "SAITO_VILLAGE_SAVE_RESIDENT"
          ) {

            const residentNo =
              normalizeResidentNo(
                data.residentNo
              );

            if (!residentNo) {

              return;

            }

            try {

              localStorage.setItem(

                RESIDENT_STORAGE_KEY,

                residentNo

              );

            }
            catch (error) {

              console.warn(
                "村民情報を保存できませんでした。",
                error
              );

            }

            return;

          }

          if (
            data.type ===
            "SAITO_VILLAGE_CLEAR_RESIDENT"
          ) {

            try {

              localStorage.removeItem(
                RESIDENT_STORAGE_KEY
              );

            }
            catch (error) {

              console.warn(
                "村民情報を削除できませんでした。",
                error
              );

            }

            return;

          }

          if (
            data.type ===
            "SAITO_VILLAGE_NAVIGATE"
          ) {

            const allowedPages =
              [
                "portal",
                "fishing",
                "bar",
                "notebook",
                "exploration",
                "utsushimi",
                "janken",
                "memorial"
              ];

            const page =
              String(
                data.page || "portal"
              ).trim();

            if (
              !allowedPages.includes(page)
            ) {

              return;

            }

            const residentNo =
              normalizeResidentNo(
                data.residentNo
              ) ||
              getStoredResidentNo();

            const residentName =
              String(
                data.residentName || ""
              ).trim();

            const targetUrl =
              new URL(
                GAS_PORTAL_URL
              );

            if (page === "portal") {

              facilityFrame.classList.add(
                "village-frame-hidden"
              );

              portalFrame.classList.remove(
                "village-frame-hidden"
              );

              return;

            }

            targetUrl.searchParams.set(
              "page",
              page
            );

            targetUrl.searchParams.set(
              "bridgeToken",
              bridgeToken
            );

            if (residentNo) {

              targetUrl.searchParams.set(
                "resident",
                residentNo
              );

            }

            if (residentName) {

              targetUrl.searchParams.set(
                "residentName",
                residentName
              );

            }

            facilityFrame.src =
              targetUrl.toString();

            portalFrame.classList.add(
              "village-frame-hidden"
            );

            facilityFrame.classList.remove(
              "village-frame-hidden"
            );

          }

        }

      );


      openVillagePortal();

    })();
  </script>

</body>
</html>
