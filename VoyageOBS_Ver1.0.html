<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>齋藤村一周年 SETLIST LIVE Voyage｜OBS</title>
  <style>
    :root {
      --navy: #14264b;
      --navy-soft: #334668;
      --gold: #b78a3c;
      --gold-light: #f3d99c;
      --ivory: rgba(255, 252, 246, .84);
      --ivory-soft: rgba(255, 252, 246, .48);
      --line: rgba(183, 138, 60, .35);
      --shadow: 0 1.4vh 4vh rgba(40, 54, 90, .14);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
      color: var(--navy);
      background: #d9eaff;
      user-select: none;
    }

    .stage {
      position: relative;
      width: auto;
      height: 100vh;
      aspect-ratio: 708 / 1536;
      overflow: hidden;
      isolation: isolate;
      background-image:
        linear-gradient(90deg, rgba(255,255,255,.12), transparent 28%),
        url("https://raw.githubusercontent.com/saitosoncho/saito-village-gate/main/voyage-obs-bg.png");
      background-size: cover;
      background-position: center center;
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(circle at 18% 52%, rgba(255,255,255,.28), transparent 36%),
        linear-gradient(90deg, rgba(255,255,255,.08), transparent 48%);
    }

    .setlist {
      position: absolute;
      z-index: 4;
      left: 3.4%;
      top: 16.7%;
      width: 43%;
      padding: 1.25vh 1.2vw 1.15vh;
      border: 1px solid rgba(255,255,255,.56);
      border-left-color: rgba(183,138,60,.52);
      border-radius: 1.3vh;
      background: linear-gradient(135deg, rgba(255,255,255,.77), rgba(255,251,242,.48));
      box-shadow: var(--shadow), inset 0 0 0 1px rgba(255,255,255,.28);
      backdrop-filter: blur(8px) saturate(1.06);
      -webkit-backdrop-filter: blur(8px) saturate(1.06);
    }

    .setlist-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 .2vw .65vh;
      padding-bottom: .55vh;
      border-bottom: 1px solid var(--line);
      letter-spacing: .22em;
      font-size: clamp(10px, 1.05vw, 23px);
      color: rgba(20,38,75,.68);
    }

    .now-label {
      display: inline-flex;
      align-items: center;
      gap: .35vw;
      min-height: 1.65vh;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: clamp(8px, .78vw, 17px);
      letter-spacing: .14em;
      color: var(--gold);
      opacity: 0;
      transition: opacity .45s ease;
    }
    .now-label.on { opacity: 1; }

    .equalizer { display: inline-flex; align-items: end; gap: 2px; height: 1.05em; }
    .equalizer i {
      display: block; width: 2px; height: 35%; border-radius: 3px; background: var(--gold);
      animation: eq .9s ease-in-out infinite alternate;
    }
    .equalizer i:nth-child(2) { animation-delay: -.35s; }
    .equalizer i:nth-child(3) { animation-delay: -.62s; }
    @keyframes eq { to { height: 100%; } }

    .tracks { display: flex; flex-direction: column; gap: .16vh; }
    .track {
      --delay: 0ms;
      position: relative;
      display: grid;
      grid-template-columns: 2.4em minmax(0, 1fr);
      align-items: center;
      min-height: 3.28vh;
      padding: .27vh .55vw;
      border-bottom: 1px solid rgba(183,138,60,.18);
      border-radius: .72vh;
      overflow: hidden;
      opacity: .9;
      transform: translateZ(0);
      transition: opacity .55s ease, filter .55s ease, transform .55s ease,
                  background .55s ease, box-shadow .55s ease, max-height .7s ease,
                  margin .7s ease, padding .7s ease, border-width .7s ease;
      animation: trackIn .65s both;
      animation-delay: var(--delay);
    }
    @keyframes trackIn {
      from { opacity: 0; transform: translateX(-1.8vw); }
      to { opacity: .9; transform: translateX(0); }
    }

    .track-no {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(10px, 1.25vw, 27px);
      letter-spacing: .04em;
      color: var(--gold);
      font-variant-numeric: tabular-nums;
    }
    .track-copy { min-width: 0; line-height: 1.05; }
    .track-title {
      display: block;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-weight: 700;
      font-size: clamp(10px, 1.27vw, 28px);
      letter-spacing: .015em;
      text-shadow: 0 1px 0 rgba(255,255,255,.68);
    }
    .track-artist {
      display: block;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      margin-top: .12vh;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: clamp(7px, .72vw, 16px);
      letter-spacing: .045em;
      color: rgba(51,70,104,.72);
    }

    .track.done {
      opacity: .2;
      filter: grayscale(.85) saturate(.35);
      transform: scale(.985);
    }
    .track.done .track-title { text-decoration: line-through; text-decoration-thickness: 1px; }

    .track.current {
      z-index: 2;
      opacity: 1;
      filter: none;
      transform: translateX(.6vw) scale(1.025);
      background: linear-gradient(90deg, rgba(255,248,224,.94), rgba(255,255,255,.72));
      box-shadow: 0 .55vh 1.5vh rgba(112,77,23,.18), inset .28vw 0 0 var(--gold);
      animation: currentGlow 2.4s ease-in-out infinite;
    }
    .track.current .track-no { color: #8b5e16; }
    .track.current .track-title { color: #0e2148; }
    @keyframes currentGlow {
      50% { box-shadow: 0 .8vh 2vh rgba(112,77,23,.24), inset .28vw 0 0 #d8ad58; }
    }

    .track.encore {
      max-height: 0;
      min-height: 0;
      padding-top: 0;
      padding-bottom: 0;
      margin: 0;
      border-width: 0;
      opacity: 0;
      pointer-events: none;
    }
    .encore-open .track.encore {
      max-height: 4.4vh;
      min-height: 3.28vh;
      padding-top: .27vh;
      padding-bottom: .27vh;
      border-width: 0 0 1px;
      opacity: .9;
      pointer-events: auto;
      animation: encoreReveal 1.2s cubic-bezier(.2,.75,.15,1) both;
    }
    .encore-open .track.encore:nth-last-child(1) { animation-delay: .18s; }
    @keyframes encoreReveal {
      0% { opacity: 0; transform: translateY(-1.2vh) scale(.92); filter: brightness(1.8); }
      60% { opacity: 1; filter: brightness(1.3); }
      100% { opacity: .9; transform: translateY(0) scale(1); filter: none; }
    }
    .track.encore::after {
      content: "ENCORE";
      position: absolute;
      right: .55vw;
      top: .32vh;
      font: 600 clamp(6px,.53vw,12px)/1 ui-sans-serif, system-ui, sans-serif;
      letter-spacing: .14em;
      color: rgba(183,138,60,.62);
    }

    .particles { position: absolute; inset: 0; z-index: 3; pointer-events: none; overflow: hidden; }
    .particle { position: absolute; top: -12%; will-change: transform, opacity; }
    .note {
      color: rgba(255,245,205,.72);
      text-shadow: 0 0 9px rgba(255,196,75,.75), 0 0 22px rgba(255,196,75,.38);
      font-family: Georgia, serif;
      animation: noteFall var(--dur) linear var(--wait) infinite;
    }
    @keyframes noteFall {
      0% { transform: translate3d(0,-8vh,0) rotate(0deg); opacity: 0; }
      12% { opacity: var(--alpha); }
      82% { opacity: var(--alpha); }
      100% { transform: translate3d(var(--drift),120vh,0) rotate(var(--spin)); opacity: 0; }
    }
    .feather {
      width: var(--size); height: calc(var(--size) * 2.8);
      border-radius: 85% 15% 85% 15% / 60% 20% 80% 40%;
      background: linear-gradient(150deg, rgba(255,255,255,.88), rgba(255,225,236,.35));
      box-shadow: inset 1px 0 rgba(255,255,255,.8), 0 0 12px rgba(255,235,241,.35);
      transform-origin: center;
      animation: featherFall var(--dur) ease-in-out var(--wait) infinite;
    }
    .feather::after {
      content: ""; position: absolute; left: 52%; top: 8%; bottom: -16%; width: 1px;
      background: rgba(171,130,153,.48); transform: rotate(4deg);
    }
    @keyframes featherFall {
      0% { transform: translate3d(0,-10vh,0) rotate(-25deg); opacity: 0; }
      13% { opacity: var(--alpha); }
      45% { transform: translate3d(calc(var(--drift) * .45),48vh,0) rotate(28deg); }
      78% { opacity: var(--alpha); }
      100% { transform: translate3d(var(--drift),120vh,0) rotate(-18deg); opacity: 0; }
    }
    .fx-off .particle { display: none; }
    .fx-soft .particle:nth-child(2n) { display: none; }

    .control-hotspot {
      position: absolute; z-index: 20; top: 1.2vh; right: 1.2vw;
      width: 6vh; height: 6vh; border: 0; border-radius: 50%; cursor: pointer;
      display: grid; place-items: center;
      font-size: 2.4vh; color: white; background: rgba(20,38,75,.65);
      box-shadow: 0 .4vh 1.4vh rgba(20,38,75,.2);
      opacity: 0; transition: opacity .25s ease, transform .25s ease;
    }
    .control-hotspot:hover, .control-hotspot:focus-visible { opacity: .9; transform: rotate(30deg); }

    .settings {
      position: absolute; z-index: 30; inset: 0 0 0 auto;
      width: min(78vw, 540px); padding: 2.3vh 4.2vw 3vh;
      display: flex; flex-direction: column;
      background: rgba(250,249,247,.96);
      color: #172747;
      box-shadow: -2vw 0 6vw rgba(16,33,68,.26);
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      transform: translateX(105%); transition: transform .4s cubic-bezier(.2,.8,.2,1);
      overflow-y: auto;
    }
    .settings.open { transform: translateX(0); }
    .settings h2 { margin: 0 0 .4vh; font: 700 2.6vh/1.2 Georgia, serif; }
    .settings-note { margin: 0 0 1.6vh; font-size: 1.25vh; color: #65708a; }
    .settings-close {
      position: absolute; right: 3vw; top: 1.6vh; border: 0; background: transparent;
      color: #243554; font-size: 3vh; cursor: pointer;
    }
    .control-row { display: grid; grid-template-columns: 1fr 1.35fr; gap: 1.2vw; margin-bottom: 1.1vh; }
    .control-row.three { grid-template-columns: 1fr 1fr 1fr; }
    .ctrl {
      min-height: 4.4vh; border: 1px solid rgba(31,50,84,.18); border-radius: 1vh;
      background: white; color: #1d3156; padding: .7vh 1vw; cursor: pointer;
      font: 650 1.35vh/1.15 ui-sans-serif, system-ui, sans-serif;
      box-shadow: 0 .35vh 1vh rgba(31,50,84,.06);
    }
    .ctrl:hover { border-color: #b78a3c; }
    .ctrl.primary { color: #fff; background: linear-gradient(135deg,#8b641d,#c89e51); }
    .ctrl.danger { color: #9b3349; }
    .setting-block { margin: 1.1vh 0; padding-top: 1.1vh; border-top: 1px solid rgba(31,50,84,.12); }
    .setting-title { margin-bottom: .8vh; font-size: 1.25vh; font-weight: 800; letter-spacing: .08em; }
    .fx-options { display: grid; grid-template-columns: repeat(3,1fr); gap: .8vw; }
    .song-buttons { display: grid; grid-template-columns: 1fr; gap: .55vh; }
    .song-button {
      width: 100%; min-height: 3.7vh; display: grid; grid-template-columns: 2.6em 1fr;
      text-align: left; align-items: center; border: 1px solid rgba(31,50,84,.12);
      border-radius: .75vh; background: rgba(255,255,255,.82); color: #263857;
      padding: .5vh 1vw; cursor: pointer; font-size: 1.15vh;
    }
    .song-button.active { border-color: #b78a3c; background: #fff7df; color: #714d0d; font-weight: 800; }
    .song-button.locked { display: none; }
    .shortcut { margin-top: 1.3vh; color: #7b8292; font-size: 1.05vh; line-height: 1.55; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <main id="stage" class="stage fx-normal" aria-label="Voyage OBS display">
    <div id="particles" class="particles" aria-hidden="true"></div>

    <section id="setlist" class="setlist" aria-label="セットリスト">
      <header class="setlist-head">
        <span>SET LIST</span>
        <span id="nowLabel" class="now-label"><span class="equalizer"><i></i><i></i><i></i></span> NOW SINGING</span>
      </header>
      <div id="tracks" class="tracks"></div>
    </section>

    <button id="settingsOpen" class="control-hotspot" type="button" title="設定（Sキー）" aria-label="設定を開く">⚙</button>

    <aside id="settings" class="settings" aria-label="設定画面">
      <button id="settingsClose" class="settings-close" type="button" aria-label="設定を閉じる">×</button>
      <h2>Voyage Control</h2>
      <p class="settings-note">曲を選ぶと、それより前の曲が歌唱済みになります。</p>

      <div class="control-row three">
        <button id="prevButton" class="ctrl" type="button">← 前へ</button>
        <button id="standbyButton" class="ctrl" type="button">待機中</button>
        <button id="nextButton" class="ctrl primary" type="button">次へ →</button>
      </div>
      <div class="control-row">
        <button id="mainEndButton" class="ctrl" type="button">本編終了</button>
        <button id="encoreButton" class="ctrl primary" type="button">アンコール解禁</button>
      </div>

      <section class="setting-block">
        <div class="setting-title">降る演出</div>
        <div class="fx-options">
          <button class="ctrl fx-button" data-fx="off" type="button">OFF</button>
          <button class="ctrl fx-button" data-fx="soft" type="button">控えめ</button>
          <button class="ctrl fx-button" data-fx="normal" type="button">通常</button>
        </div>
      </section>

      <section class="setting-block">
        <div class="setting-title">現在の曲を選択</div>
        <div id="songButtons" class="song-buttons"></div>
      </section>

      <button id="resetButton" class="ctrl danger" type="button">すべてリセット</button>
      <div class="shortcut">キーボード：S＝設定／→＝次へ／←＝前へ／E＝アンコール解禁／Esc＝設定を閉じる</div>
    </aside>
  </main>

  <script>
    (() => {
      "use strict";

      const songs = [
        ["Voyage", "浜崎あゆみ"],
        ["真冬のパンセ", "KinKi Kids"],
        ["TRUE BLUE.", "LUNA SEA"],
        ["flower", "L'Arc-en-Ciel"],
        ["春咲センチメンタル", "Plastic Tree"],
        ["Cassis", "the GazettE"],
        ["EDEN", "D"],
        ["alkaloid showcase", "摩天楼オペラ"],
        ["You got game?", "KIMERU"],
        ["アンインストール", "石川智晶"],
        ["真赤な誓い", "福山芳樹"],
        ["Nova Era", "Angra"],
        ["DESTINY", "GALNERYUS"],
        ["oath sign", "LiSA"],
        ["Vitalization", "水樹奈々"],
        ["サクリファイス", "まふまふ"],
        ["BALALAIKA", "9Lana"],
        ["ビバリウム", "Ado"],
        ["インフェルノ", "Mrs. GREEN APPLE"],
        ["甲賀忍法帖", "陰陽座"]
      ];

      const STORAGE_KEY = "voyage-obs-state-v1";
      const defaultState = { current: -1, encore: false, fx: "normal" };
      const state = loadState();

      const stage = document.getElementById("stage");
      const setlist = document.getElementById("setlist");
      const tracks = document.getElementById("tracks");
      const songButtons = document.getElementById("songButtons");
      const nowLabel = document.getElementById("nowLabel");
      const settings = document.getElementById("settings");

      function loadState() {
        try {
          return { ...defaultState, ...JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}") };
        } catch (_) {
          return { ...defaultState };
        }
      }

      function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }

      function pad(n) { return String(n + 1).padStart(2, "0"); }

      function buildList() {
        tracks.textContent = "";
        songButtons.textContent = "";
        songs.forEach(([title, artist], index) => {
          const row = document.createElement("div");
          row.className = "track" + (index >= 18 ? " encore" : "");
          row.dataset.index = String(index);
          row.style.setProperty("--delay", `${Math.min(index * 42, 650)}ms`);
          row.innerHTML = `<span class="track-no">${pad(index)}</span><span class="track-copy"><span class="track-title"></span><span class="track-artist"></span></span>`;
          row.querySelector(".track-title").textContent = title;
          row.querySelector(".track-artist").textContent = artist;
          tracks.appendChild(row);

          const button = document.createElement("button");
          button.type = "button";
          button.className = "song-button" + (index >= 18 ? " encore-choice" : "");
          button.dataset.index = String(index);
          button.innerHTML = `<strong>${pad(index)}</strong><span></span>`;
          button.querySelector("span").textContent = `${title} ／ ${artist}`;
          button.addEventListener("click", () => setCurrent(index));
          songButtons.appendChild(button);
        });
      }

      function render() {
        setlist.classList.toggle("encore-open", state.encore);
        stage.classList.remove("fx-off", "fx-soft", "fx-normal");
        stage.classList.add(`fx-${state.fx}`);
        const hasVisibleCurrent = state.current >= 0 && state.current < songs.length &&
          (state.current < 18 || state.encore);
        nowLabel.classList.toggle("on", hasVisibleCurrent);

        document.querySelectorAll(".track").forEach((row) => {
          const index = Number(row.dataset.index);
          row.classList.toggle("done", index < state.current || state.current >= songs.length);
          row.classList.toggle("current", index === state.current && (index < 18 || state.encore));
        });
        document.querySelectorAll(".song-button").forEach((button) => {
          const index = Number(button.dataset.index);
          button.classList.toggle("active", index === state.current);
          button.classList.toggle("locked", index >= 18 && !state.encore);
        });
        document.querySelectorAll(".fx-button").forEach((button) => {
          button.classList.toggle("primary", button.dataset.fx === state.fx);
        });
        document.getElementById("encoreButton").textContent = state.encore ? "アンコール表示中" : "アンコール解禁";
        saveState();
      }

      function setCurrent(index) {
        if (index >= 18 && !state.encore) return;
        state.current = Math.max(-1, Math.min(index, songs.length));
        render();
      }

      function move(delta) {
        const last = state.encore ? songs.length - 1 : 17;
        if (!state.encore && delta > 0 && state.current >= last) return;
        let next = state.current + delta;
        if (delta > 0 && state.current < 0) next = 0;
        state.current = Math.max(-1, Math.min(next, last));
        render();
      }

      function revealEncore() {
        state.encore = true;
        render();
      }

      function createParticles() {
        const holder = document.getElementById("particles");
        const noteChars = ["♪", "♫", "♩", "♬"];
        const random = (min, max) => Math.random() * (max - min) + min;

        for (let i = 0; i < 14; i++) {
          const p = document.createElement("span");
          p.className = "particle note";
          p.textContent = noteChars[i % noteChars.length];
          p.style.left = `${random(4, 97)}%`;
          p.style.fontSize = `${random(1.15, 2.8)}vh`;
          p.style.setProperty("--dur", `${random(15, 27)}s`);
          p.style.setProperty("--wait", `${random(-26, 0)}s`);
          p.style.setProperty("--drift", `${random(-12, 12)}vw`);
          p.style.setProperty("--spin", `${random(-260, 260)}deg`);
          p.style.setProperty("--alpha", random(.25, .65).toFixed(2));
          holder.appendChild(p);
        }
        for (let i = 0; i < 9; i++) {
          const p = document.createElement("span");
          p.className = "particle feather";
          p.style.left = `${random(2, 98)}%`;
          p.style.setProperty("--size", `${random(.45, 1.05)}vw`);
          p.style.setProperty("--dur", `${random(20, 34)}s`);
          p.style.setProperty("--wait", `${random(-32, 0)}s`);
          p.style.setProperty("--drift", `${random(-16, 16)}vw`);
          p.style.setProperty("--alpha", random(.25, .58).toFixed(2));
          holder.appendChild(p);
        }
      }

      function openSettings() { settings.classList.add("open"); }
      function closeSettings() { settings.classList.remove("open"); }

      buildList();
      createParticles();
      render();

      document.getElementById("settingsOpen").addEventListener("click", openSettings);
      document.getElementById("settingsClose").addEventListener("click", closeSettings);
      document.getElementById("prevButton").addEventListener("click", () => move(-1));
      document.getElementById("nextButton").addEventListener("click", () => move(1));
      document.getElementById("standbyButton").addEventListener("click", () => setCurrent(-1));
      document.getElementById("mainEndButton").addEventListener("click", () => setCurrent(18));
      document.getElementById("encoreButton").addEventListener("click", revealEncore);
      document.getElementById("resetButton").addEventListener("click", () => {
        Object.assign(state, defaultState);
        render();
      });
      document.querySelectorAll(".fx-button").forEach((button) => {
        button.addEventListener("click", () => {
          state.fx = button.dataset.fx;
          render();
        });
      });

      window.addEventListener("keydown", (event) => {
        if (event.key === "s" || event.key === "S") settings.classList.toggle("open");
        if (event.key === "Escape") closeSettings();
        if (event.key === "ArrowRight") move(1);
        if (event.key === "ArrowLeft") move(-1);
        if (event.key === "e" || event.key === "E") revealEncore();
      });
    })();
  </script>
</body>
</html>
